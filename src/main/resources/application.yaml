spring:
  application:
    name: aviation-app-spring

  datasource:
    url: jdbc:postgresql://localhost:5429/aviation_db
    username: user
    password: root
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true


